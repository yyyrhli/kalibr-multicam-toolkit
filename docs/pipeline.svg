<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f16"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d29922"/>
    </marker>
  </defs>

  <rect width="1200" height="880" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#bar)"/>

  <!-- 标题 -->
  <text x="48" y="52" fill="#e6edf3" font-size="24" font-weight="700">Kalibr 多相机标定流水线 · 数据流</text>
  <text x="48" y="78" fill="#8b949e" font-size="13">从多路视频到 camchain，两个阶段，全程脚本化 · 不含任何图形界面</text>
  <rect x="48" y="94" width="1104" height="1" fill="#21262d"/>

  <!-- 泳道标题 -->
  <text x="70" y="128" fill="#58a6ff" font-size="14" font-weight="600">阶段 A · 多相机内参 + 相机间外参</text>
  <text x="660" y="128" fill="#a371f7" font-size="14" font-weight="600">阶段 B · IMU–相机外参 + 时间偏移</text>

  <!-- ================= 左列 ================= -->
  <!-- 1 输入 -->
  <rect x="70" y="146" width="470" height="70" rx="8" fill="#12161d" stroke="#30363d" stroke-dasharray="5 4"/>
  <text x="90" y="172" fill="#c9d1d9" font-size="13" font-weight="600">输入：场次目录</text>
  <text x="90" y="194" fill="#8b949e" font-size="11" font-family="ui-monospace,Consolas,monospace">fisheye0…N.mp4 · frames_*.csv · sess_*.json</text>
  <text x="90" y="208" fill="#6e7681" font-size="10">时间基准统一 unix_ns</text>

  <line x1="305" y1="216" x2="305" y2="248" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 2 选帧 -->
  <rect x="70" y="252" width="470" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
  <rect x="70" y="252" width="4" height="70" rx="2" fill="#d29922"/>
  <text x="90" y="278" fill="#e6edf3" font-size="13" font-weight="600">AprilGrid 选帧与门禁</text>
  <text x="90" y="299" fill="#8b949e" font-size="10.5" font-family="ui-monospace,Consolas,monospace">aprilgrid_selection.py</text>
  <text x="90" y="313" fill="#6e7681" font-size="10">八项覆盖度 · 共见连通图 · 时间槽同步</text>

  <line x1="305" y1="322" x2="305" y2="354" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 3 bag -->
  <rect x="70" y="358" width="470" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="90" y="384" fill="#e6edf3" font-size="13" font-weight="600">写 ROS1 bag（mono8）</text>
  <text x="90" y="405" fill="#8b949e" font-size="10.5" font-family="ui-monospace,Consolas,monospace">dump_camera_bag.py · write_kalibr_bag.py</text>
  <text x="90" y="419" fill="#6e7681" font-size="10">多 worker 并行解码 · 单 writer 按时间戳写入</text>

  <line x1="305" y1="428" x2="305" y2="460" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 4 kalibr 相机 -->
  <rect x="70" y="464" width="470" height="70" rx="8" fill="#181430" stroke="#8b6bff" stroke-opacity="0.5"/>
  <text x="90" y="490" fill="#c9b6ff" font-size="13" font-weight="600">kalibr_calibrate_cameras</text>
  <text x="90" y="511" fill="#a99dc9" font-size="10.5" font-family="ui-monospace,Consolas,monospace">外部依赖 · Double Sphere (ds-none)</text>
  <text x="90" y="525" fill="#6e7681" font-size="10">非线性优化，输出相机链</text>

  <line x1="305" y1="534" x2="305" y2="566" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 5 产物 -->
  <rect x="70" y="570" width="470" height="70" rx="8" fill="#0f2b17" stroke="#1f5130"/>
  <text x="90" y="596" fill="#56d364" font-size="13" font-weight="600">calib-camchain.yaml</text>
  <text x="90" y="617" fill="#7ee787" font-size="10.5" font-family="ui-monospace,Consolas,monospace">convert_kalibr_camchain.py · camchain_camn.py</text>
  <text x="90" y="631" fill="#6e7681" font-size="10">内参 + 相机间外参，fisheyeN → camN 键转换</text>

  <!-- ================= 右列 ================= -->
  <!-- 1 输入 -->
  <rect x="660" y="146" width="470" height="70" rx="8" fill="#12161d" stroke="#30363d" stroke-dasharray="5 4"/>
  <text x="680" y="172" fill="#c9d1d9" font-size="13" font-weight="600">输入：同一场次 + IMU</text>
  <text x="680" y="194" fill="#8b949e" font-size="11" font-family="ui-monospace,Consolas,monospace">fisheye0…N.mp4 · imu_*.bin</text>
  <text x="680" y="208" fill="#6e7681" font-size="10">IMU 全频率写入，图像按时间槽降采样</text>

  <line x1="895" y1="216" x2="895" y2="248" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 2 联合 bag -->
  <rect x="660" y="252" width="470" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="680" y="278" fill="#e6edf3" font-size="13" font-weight="600">构建联合 bag</text>
  <text x="680" y="299" fill="#8b949e" font-size="10.5" font-family="ui-monospace,Consolas,monospace">20_prepare_imu_camera.sh</text>
  <text x="680" y="313" fill="#6e7681" font-size="10">灰度图 + 全频率 IMU，单一时间轴</text>

  <line x1="895" y1="322" x2="895" y2="354" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 3 kalibr 联合 -->
  <rect x="660" y="358" width="470" height="70" rx="8" fill="#181430" stroke="#8b6bff" stroke-opacity="0.5"/>
  <text x="680" y="384" fill="#c9b6ff" font-size="13" font-weight="600">kalibr_calibrate_imu_camera</text>
  <text x="680" y="405" fill="#a99dc9" font-size="10.5" font-family="ui-monospace,Consolas,monospace">+ 共享 timeshift 补丁（可选）</text>
  <text x="680" y="419" fill="#6e7681" font-size="10">冻结时间优化，只解外参</text>

  <line x1="895" y1="428" x2="895" y2="460" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 4 产物 -->
  <rect x="660" y="464" width="470" height="70" rx="8" fill="#0f2b17" stroke="#1f5130"/>
  <text x="680" y="490" fill="#56d364" font-size="13" font-weight="600">calib-camchain-imucam.yaml</text>
  <text x="680" y="511" fill="#7ee787" font-size="10.5" font-family="ui-monospace,Consolas,monospace">convert_kalibr_imucam.py → JSON</text>
  <text x="680" y="525" fill="#6e7681" font-size="10">T_cam_imu · timeshift_cam_imu</text>

  <!-- 阶段 A 产物 → 阶段 B 的虚线箭头 -->
  <path d="M 540 605 L 620 605 L 620 181 L 656 181" fill="none" stroke="#3fb950" stroke-width="1.6"
        stroke-dasharray="6 4" marker-end="url(#ag)"/>

  <!-- ================= 底部说明 ================= -->
  <rect x="48" y="700" width="1104" height="1" fill="#21262d"/>

  <text x="70" y="736" fill="#8b949e" font-size="12" font-weight="600">这套脚本负责</text>
  <text x="215" y="736" fill="#c9d1d9" font-size="12">数据准备 · 选帧门禁 · bag 构建 · 格式转换 · 参数实测 · 流水线编排</text>

  <text x="70" y="764" fill="#8b949e" font-size="12" font-weight="600">不负责的部分</text>
  <text x="215" y="764" fill="#c9d1d9" font-size="12">标定算法本身（由 Kalibr / TartanCalib 完成）· 图像采集硬件 · 图形界面</text>

  <text x="70" y="792" fill="#8b949e" font-size="12" font-weight="600">可调参数</text>
  <text x="215" y="792" fill="#c9d1d9" font-size="12">相机路数 N · 时间槽步长 · 解码 worker 数 · 门禁阈值 · IMU 信号源</text>

  <text x="70" y="820" fill="#8b949e" font-size="12" font-weight="600">两阶段关系</text>
  <text x="215" y="820" fill="#3fb950" font-size="12">阶段 A 产出的 camchain 是阶段 B 的先验；任一门禁不通过则回到采集重录</text>

  <!-- 角标 -->
  <text x="1152" y="736" fill="#30363d" font-size="11" text-anchor="end">kalibr-multicam-toolkit</text>
  <text x="1152" y="760" fill="#30363d" font-size="11" text-anchor="end">ROS1 Noetic · MIT</text>
  <text x="1152" y="784" fill="#30363d" font-size="11" text-anchor="end">YRH · 2026</text>
</svg>
